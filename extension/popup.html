<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .header img {
      width: 32px;
      height: 32px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .badge {
      display: inline-block;
      background: rgba(37, 211, 102, 0.2);
      color: #25d366;
      border: 1px solid rgba(37, 211, 102, 0.4);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .desc {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background: #25d366;
      color: #052e16;
      text-align: center;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #20ba59;
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Surgas">
    <div>
      <div class="title">SURGAS WSP</div>
      <div class="subtitle">Automatizador & CRM de WhatsApp</div>
    </div>
  </div>

  <div class="badge">● 100% Libre y Privado</div>

  <div class="desc">
    Para usar la herramienta, abre <strong>WhatsApp Web</strong>. Verás aparecer el botón flotante <strong>"🔥 Surgas Masivo"</strong> directamente en la esquina de tu pantalla.
  </div>

  <button id="btn-open-wa" class="btn">Abrir WhatsApp Web</button>

  <div class="footer">
    Surgas Tacna • Envíos seguros anti-bloqueo
  </div>

  <script src="popup.js"></script>
</body>
</html>
